spring.application.name=payroll-management

# PostgreSQL (override via env or use docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/rwanda_erp_payroll
spring.datasource.username=postgres
spring.datasource.password=100aistuff
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Institution name used in payroll notification messages
app.institution.name=Government of Rwanda ERP

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

server.port=8080

server.error.include-message=always
server.error.include-binding-errors=always

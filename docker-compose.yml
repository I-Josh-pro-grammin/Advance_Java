services:
  postgres:
    image: postgres:16-alpine
    container_name: rwanda-erp-payroll-db
    environment:
      POSTGRES_DB: rwanda_erp_payroll
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - payroll_pg_data:/var/lib/postgresql/data

volumes:
  payroll_pg_data:
